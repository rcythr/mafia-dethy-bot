experiment:
  name: dethy_mafia_ppo
  tracking_uri: http://storage.local:5000
  run_name: null
  system_metrics: true     # MLflow logs CPU/RAM/disk/network and GPU utilisation + memory

training:
  epochs: 100
  games_per_epoch: 32
  learning_rate: 1.0e-4    # peak LR
  lr_warmup_epochs: 5      # linear ramp up to the peak
  lr_min_ratio: 0.1        # cosine decay floor, as a fraction of the peak
  ppo_clip: 0.2
  kl_coef: 0.1
  entropy_coef: 0.01
  value_coef: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  transcript_every: 1      # epochs between sample game transcripts logged to MLflow
  resume_from: null        # path of an earlier run's adapter dir: reload its newest complete checkpoint and continue
  artifact_every: 10       # epochs between MLflow adapter uploads
  value_warmup_epochs: 2   # epochs that train only the value head (critic warm-up)
  normalize_by_team: true  # normalise advantages separately for Mafia and Cops
  ppo_epochs: 1            # passes over each rollout batch
  grad_accum_steps: 8      # trajectory steps per optimizer step (batch size is 1 sequence)
  max_grad_norm: 1.0
  masked_vote_logprobs: true  # train-time vote log-probs use the same alive-digit mask as sampling

env:
  min_dialogue_rounds: 1
  max_dialogue_rounds: 3
  allow_no_lynch: true       # players may vote 9 = "no one"; if it wins the vote nobody is eliminated
  lynch_rule: plurality      # plurality: most votes wins, a tie for first elects no one; majority: need more than half of the living players
  think_tokens: 0            # >0: private reasoning (max tokens) before each night action and vote
  rewards:                      # see RewardConfig in dethy_rl/env.py
    lynch_mafia: 1.0
    parity: 1.0
    lynch_town: 0.2
    night_kill: 0.2
    heat: 0.3
    vote_mafia_bonus: 0.2
    vote_town_penalty: 0.05
    investigate_mafia_bonus: 0.1

model:
  name: unsloth/Llama-3.2-3B-Instruct
  max_tokens: 96           # max new tokens for a dialogue turn
  max_model_len: 4096
  chat_template_kwargs:     # extra chat-template args; templates ignore ones they don't use. Gemma 4 / Qwen3: turn built-in thinking off (we run our own scratchpad)
    enable_thinking: false
  use_chat_template: true  # wrap prompts in the model's chat template (rules = system, rest = user)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

vllm:
  gpu_memory_utilization: 0.3   # fraction of GPU memory vLLM reserves; the trainer uses the rest
  max_num_seqs: 64
  enforce_eager: true
  vote_mask_mode: allowed_token_ids  # vLLM V1 (default engine). "logits_processor" only works on the old V0 engine (VLLM_USE_V1=0)
  logprobs_mode: processed_logprobs # logprobs must match the masked sampling distribution

rollout:
  temperature: 1.0         # keep 1.0 so old_log_probs describe the sampling policy
  max_concurrent_lobbies: 32
  seed: 0

tracing:                        # MLflow traces: one per game, one span per LLM call
  enabled: true
  lobbies_per_epoch: 2          # only trace this many games per traced epoch (keeps overhead low)
  every_n_epochs: 1

paths:
  adapter_dir: ./adapters/${now:%Y%m%d-%H%M%S}   # one directory per run

hydra:
  job:
    chdir: false
  run:
    dir: .
